version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@11.5
  shellcheck: circleci/shellcheck@3.1
  cli: circleci/circleci-cli@0.1.9
  bats: circleci/bats@1.1.0

filters: &filters
  tags:
    only: /.*/

jobs:
  run-tests:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - bats/install
      - run:
          name: Run BATS tests
          command: bats src/tests/*.bats

workflows:
  lint-pack:
    jobs:
      #- create-orb:
      #    context: org-global
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          exclude: RC005
          filters: *filters
      - shellcheck/check:
          shell: bash
          filters: *filters
      - run-tests:
          filters: *filters
      - orb-tools/publish:
          orb-name: cci-labs/s3-cache
          vcs-type: << pipeline.project.type >>
          requires:
            - orb-tools/lint
            - orb-tools/review
            - orb-tools/pack
            - shellcheck/check
            - run-tests
      
          # Use a context to hold your publishing token.
          context: orb-publishing
          filters: *filters
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          pipeline-number: << pipeline.number >>
          vcs-type: << pipeline.project.type >>
          requires: 
            - orb-tools/publish
          filters: *filters