version: 2.1
orbs:
  continuation: cci-labs/s3-cache@dev:alpha
  orb-tools: circleci/orb-tools@11.5

filters: &filters
  tags:
    only: /.*/

jobs:
  # Basic command test with simple cache key
  command-tests:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Create test cache directory
          command: |
            mkdir -p test-cache
            echo "test data" > test-cache/data.txt
      - continuation/save-cache:
          bucket-name: cci-labs-bucket
          cache-key: << pipeline.git.branch >>
          cache-path: "test-cache"
  
  # Integration test for cache key interpolation
  integration-test-interpolation:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Create lock file for checksum testing
          command: |
            cat > package-lock.json <<EOF
            {
              "name": "test-project",
              "version": "1.0.0",
              "lockfileVersion": 2,
              "dependencies": {
                "react": "^18.0.0"
              }
            }
            EOF
      - run:
          name: Create test cache directory
          command: |
            mkdir -p node_modules_cache
            echo "cached dependencies" > node_modules_cache/test.txt
      - continuation/save-cache:
          bucket-name: cci-labs-bucket
          cache-key: '${CIRCLE_PROJECT_REPONAME}-v1-{{ checksum "package-lock.json" }}'
          cache-path: "node_modules_cache"
      - run:
          name: Remove cache to test restore
          command: rm -rf node_modules_cache
      - continuation/restore-cache:
          bucket-name: cci-labs-bucket
          cache-key: '${CIRCLE_PROJECT_REPONAME}-v1-{{ checksum "package-lock.json" }}'
      - run:
          name: Verify cache was restored with interpolated key
          command: |
            if [ ! -f "node_modules_cache/test.txt" ]; then
              echo "ERROR: Cache was not restored correctly!"
              exit 1
            fi
            echo "SUCCESS: Cache with interpolated key was saved and restored correctly!"

workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      - command-tests:
          filters: *filters
      - integration-test-interpolation:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/publish:
          orb-name: cci-labs/s3-cache
          vcs-type: << pipeline.project.type >>
          pub-type: production
          requires:
            - orb-tools/pack
            - command-tests
            - integration-test-interpolation
          context: orb-publishing
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

